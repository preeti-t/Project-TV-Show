<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Preeti Tyagi (preeti-t)</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAV -->
    <nav>
      <a href="#" id="back-to-shows" style="display: none">← Back to shows</a>
    </nav>

    <!-- SHOW SEARCH -->
    <div id="show-search-container">
      <input
        type="text"
        id="show-search"
        placeholder="Search shows..."
      />
    </div>

    <!-- SHOWS LISTING -->
    <div id="shows-root"></div>

    <!-- EPISODES CONTROLS -->
    <div id="top-bar" style="display: none">
      <input type="text" id="search-input" placeholder="Search episodes..." />
      <p id="match-count"></p>

      <select id="episode-selector">
        <option value="">Select an episode</option>
      </select>
    </div>

    <p id="status-message"></p>

    <!-- EPISODES LIST -->
    <div id="root"></div>

    <script src="script.js"></script>
  </body>
</html>
