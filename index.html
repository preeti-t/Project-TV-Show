<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Preeti Tyagi</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Top Controls -->
    <header id="top-bar">
      <button id="back-to-shows" hidden>← Back to Shows</button>

      <input
        type="text"
        id="search-input"
        placeholder="Search shows or episodes..."
      />

      <select id="sort-selector">
        <option value="az">Sort A–Z</option>
        <option value="rating">Highest Rated</option>
      </select>

      <select id="episode-selector" hidden>
        <option value="">Jump to episode...</option>
      </select>

      <p id="match-count"></p>
    </header>

    <p id="status-message"></p>

    <!-- Shows Listing -->
    <main id="shows-view"></main>

    <!-- Episodes Listing -->
    <main id="episodes-view" hidden></main>

    <footer>
      <p>
        Data from
        <a href="https://www.tvmaze.com" target="_blank">TVMaze.com</a>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
